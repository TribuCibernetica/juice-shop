name: juice-shop-devsecops

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  LOCAL_IMAGE_TAG: bkimminich/juice-shop:latest
  REPORT_DIR: gl-security-reports

jobs:

  # =========================================================================
  # 1. BUILD, TEST, SAST, SECRETS
  # =========================================================================
  build_sast_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Dependencies and Run Tests
        run: |
          npm install
          npm test

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true 
        with:
          config: 'p/ci'

      - name: SonarQube Analysis
        run: |
          echo "✅ Running SonarQube Scanner..."
          sonar-scanner \
            -Dsonar.projectKey=JUICE-SHOP-REAL \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true \
            -X

      - name: Run detect-secrets
        run: |
          pip install detect-secrets
          mkdir -p ${{ env.REPORT_DIR }}
          detect-secrets scan --baseline . --exclude-files '.git/*' --output ${{ env.REPORT_DIR }}/secrets-report.json
          echo "=== Secrets Report ==="
          cat ${{ env.REPORT_DIR }}/secrets-report.json

          - name: Gate: Fail if Secrets Detected
            run: |
              if ! grep -q '"results": {}' ${{ env.REPORT_DIR }}/secrets-report.json 2>/dev/null; then
                echo "❌ Secrets encontrados, fallando pipeline"
                exit 1
              else
                echo "✅ No se detectaron secrets"
              fi

      - name: Upload Secrets Report
        uses: actions/upload-artifact@v4
        with:
          name: secrets-report
          path: ${{ env.REPORT_DIR }}/secrets-report.json

      - name: Pull Juice Shop Docker Image
        run: docker pull ${{ env.LOCAL_IMAGE_TAG }}

  # =========================================================================
  # 2. SCA / Container Scan (Trivy)
  # =========================================================================
  container_scan:
    runs-on: ubuntu-latest
    needs: [build_sast_secrets]
    steps:
      - name: Run Trivy Container Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $PWD:/app \
            aquasec/trivy:latest image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            ${{ env.LOCAL_IMAGE_TAG }}

      - name: Show Trivy Scan Results
        run: cat trivy-results.sarif

      - name: Upload Trivy SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # =========================================================================
  # 3. DAST Scan (OWASP ZAP)
  # =========================================================================
  dast_scan:
    runs-on: ubuntu-latest
    needs: [build_sast_secrets]
    env:
      TARGET_URL: http://localhost:3000
    steps:
      - name: Start Juice Shop Container
        run: |
          docker run -d --name juice-shop-test -p 3000:3000 ${{ env.LOCAL_IMAGE_TAG }}
          sleep 30

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm -v $PWD:/zap/wrk/:Z ghcr.io/zaproxy/zaproxy/zap-baseline:stable \
            -t ${{ env.TARGET_URL }} \
            -r zap-baseline-report.xml \
            -J zap-baseline-report.json \
            -I

      - name: Show ZAP Scan Results
        run: cat zap-baseline-report.json

      - name: Check ZAP Alerts
        run: |
          if grep -q '"risk": "High"' zap-baseline-report.json || grep -q '"risk": "Critical"' zap-baseline-report.json; then
            echo "❌ ¡DAST Falló! Alertas Altas/Críticas."
            exit 1
          else
            echo "✅ DAST completado."

      - name: Stop Juice Shop Container
        if: always()
        run: docker stop juice-shop-test

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-baseline-report.json

  # =========================================================================
  # 4. Aggregate Reports
  # =========================================================================
  aggregate_reports:
    runs-on: ubuntu-latest
    needs: [build_sast_secrets, container_scan, dast_scan]
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Aggregate Final Report
        run: |
          mkdir -p final-report
          echo "=== DevSecOps Final Report ===" > final-report/summary.txt
          echo "--- Secrets ---" >> final-report/summary.txt
          cat reports/secrets-report/secrets-report.json >> final-report/summary.txt || true
          echo "--- Trivy ---" >> final-report/summary.txt
          cat reports/trivy-results.sarif >> final-report/summary.txt || true
          echo "--- ZAP ---" >> final-report/summary.txt
          cat reports/zap-report/zap-baseline-report.json >> final-report/summary.txt || true

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: final-report/

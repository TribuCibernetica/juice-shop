name: 🚨 Juice Shop DevSecOps Pipeline: BUILD + SCAN 🚨
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  LOCAL_IMAGE_TAG: local-juice-shop:latest # Etiqueta para la imagen que construimos
  REPORT_DIR: gl-security-reports

jobs:

  # =========================================================================
  # 1. BUILD, TEST, SAST, SCA, SECRETS (Trabajando en el código fuente)
  # =========================================================================
  build_sast_sca:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        fetch-depth: 0

      # --- SETUP NODE.JS (Reemplaza el antiguo "mvn") ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # --- BUILD and UNIT TESTS ---
      - name: Install Dependencies and Run Tests
        run: |
          npm install
          npm test

      # --- SAST: SonarQube (EJECUCIÓN REAL sobre el código fuente) ---
      - name: Run SonarQube Analysis
        uses: sonarsource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=JUICE-SHOP-REAL # Clave única del proyecto
            -Dsonar.sources=.
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.qualitygate.wait=true

      # --- DOCKER BUILD (Construir la imagen a partir de este código) ---
      - name: Build Local Docker Image
        run: |
          docker build -t ${{ env.LOCAL_IMAGE_TAG }} .

      # --- SECRETS y SCA (Los escaneos que corren sobre el código base) ---
      - name: Run detect-secrets
        uses: docker://python:3.9-slim
        with:
          args: sh -c "pip install detect-secrets && detect-secrets scan --baseline . --exclude-files '.git/*' --output ${{ env.REPORT_DIR }}/secrets-report.json || true"
      # (Se pueden añadir más pasos de SCA aquí)

      # --- GATE: Fallar si se detectan Secrets ---
      - name: Fail if Secrets Detected
        run: |
          mkdir -p ${{ env.REPORT_DIR }}
          if ! grep -q '"results": {}' ${{ env.REPORT_DIR }}/secrets-report.json 2>/dev/null; then exit 1; fi

  # =========================================================================
  # 2. CONTAINER SCAN (Trivy - Escaneando la imagen recién construida)
  # =========================================================================
  container_image_scan:
    runs-on: self-hosted
    needs: [build_sast_sca]
    steps:
      - name: Run Trivy vulnerability scanner (Contained)
        uses: docker://aquasec/trivy:latest
        with:
          args: image
                --format sarif
                --output trivy-results.sarif
                --severity CRITICAL,HIGH
                --exit-code 1
                ${{ env.LOCAL_IMAGE_TAG }} # <--- Escanea la imagen local
      - name: Upload Trivy results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # =========================================================================
  # 3. DAST SCAN (ZAP - Desplegando la imagen recién construida)
  # =========================================================================
  dast_scan:
    runs-on: self-hosted
    needs: [container_image_scan]
    env:
      TARGET_URL: http://localhost:3000

    steps:
      - name: Checkout Code # Se necesita el Dockerfile para iniciar la app
        uses: actions/checkout@v4

      # --- Despliegue Temporal (Usando la imagen local) ---
      - name: Start Juice Shop Container (Inicia la app)
        run: |
          docker run -d --name juice-shop-test -p 3000:3000 ${{ env.LOCAL_IMAGE_TAG }}
          sleep 30

      # --- OWASP ZAP (Ejecuta el ataque) ---
      - name: Run ZAP Baseline Scan
        uses: docker://ghcr.io/zaproxy/zaproxy/zap-baseline:stable
        with:
          args: -t ${{ env.TARGET_URL }}
                -r zap-baseline-report.xml
                -J zap-baseline-report.json
                -I

      - name: Check ZAP Alerts and Fail Pipeline (Gate)
        run: |
          if grep -q '"risk": "High"' zap-baseline-report.json || grep -q '"risk": "Critical"' zap-baseline-report.json; then
            echo "❌ ¡FALLO DE DAST! Se encontraron alertas Altas/Críticas."
            exit 1
          else
            echo "✅ DAST completado."
          fi

      # --- LIMPIEZA ---
      - name: Stop Juice Shop Container
        if: always()
        run: docker stop juice-shop-test

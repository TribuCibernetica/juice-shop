name: ZAP Unified Security Scan

on:
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: '0 3 * * 6' # Todos los sábados a las 3 am
  workflow_dispatch: # Permite ejecución manual para pruebas

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: OWASP ZAP Security Analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop

      # 1. Levantar la instancia local de Juice Shop
      - name: Start Juice Shop Instance
        run: |
          docker run -d -p 3000:3000 bkimminich/juice-shop
          timeout 60s bash -c 'until curl -s localhost:3000; do sleep 1; done'

     # 2. Permisos totales para evitar el AccessDenied
      - name: Fix Workspace Permissions
        run: chmod -R 777 .

      # 3. Escaneo con parámetros seguros
      - name: ZAP Baseline Scan (Quick)
        run: |
          docker run -v $(pwd):/zap/wrk/:rw --network=host -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3000 \
            -c .zap/rules.tsv \
            -j -a -l WARN -I \
            -r zap_report_baseline.html

      - name: ZAP Full Scan (Deep)
        # Para el ejercicio, este corre siempre. Luego lo comentaremos o usaremos lógica 'if'.
        run: |
          docker run -v $(pwd):/zap/wrk/:rw --network=host -t ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://localhost:3000 \
            -c .zap/rules.tsv \
            -j -a -l WARN -I \
            -r zap_report_full.html
            
      # 4. EJECUCIÓN PROGRAMADA (Full Scan - Profundo)
      - name: ZAP Full Scan (Weekly Deep Dive)
        if: github.event_name == 'schedule'
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          # En el semanal no bloqueamos (opcional), solo generamos el reporte completo
          cmd_options: '-r zap_full_report.html'

   # 5. Subida con nombre estático (Sin variables complejas)
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # El nombre del artefacto en el Summary indicará qué reporte es
          name: ZAP-Dual-Reports-Exercise
          path: '*.html' # Capturará tanto zap_report_baseline como zap_report_full

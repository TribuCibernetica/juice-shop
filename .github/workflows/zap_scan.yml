name: ZAP Unified Security Scan

on:
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: OWASP ZAP Security Analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop

      # SOLUCIÓN AL ACCESS DENIED
      - name: Prepare Workspace
        run: chmod -R 777 .

      - name: Start Juice Shop Instance
        run: |
          docker run -d -p 3000:3000 bkimminich/juice-shop
          timeout 60s bash -c 'until curl -s localhost:3000; do sleep 1; done'

      - name: ZAP Baseline Scan (PR Gateway)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          # Corregido: -l FAIL y añadimos -I para que no aborte el reporte
          cmd_options: '-r zap_report.html -l FAIL -I'

      - name: ZAP Full Scan (Weekly Deep Dive)
        if: github.event_name == 'schedule'
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-r zap_full_report.html -I'

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event_name == 'schedule' && 'zap-full-report' || 'zap-baseline-report' }}
          # Especificamos el archivo exacto para evitar errores de búsqueda
          path: |
            zap_report.html
            zap_full_report.html
